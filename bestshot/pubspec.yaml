name: bestshot
description: "BestShot — iPhone・iPad向け写真選別ワークステーション"
publish_to: 'none'
version: 3.2.0+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.12.0
  image: ^3.3.0
  opencv_dart: 2.2.1+4
  exif: ^3.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  dartcv4: 2.2.1+4
  opencv_dart: 2.2.1+4

flutter:
  uses-material-design: true
  assets:
    - assets/models/

hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
        - features2d
      # Native unit tests run on the development Mac; this is not an app target.
      macos:
        generator: "Unix Makefiles"
